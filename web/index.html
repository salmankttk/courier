<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Courier</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="word">Courier</span>
    </div>
    <label class="search">
      <span class="sr">Search files</span>
      <input id="search" type="search" placeholder="Search" autocomplete="off">
    </label>
    <div class="storage" id="storage" title="Space left on the server">
      <span class="storage-label" id="storage-label"></span>
      <span class="meter"><i id="storage-fill"></i></span>
    </div>
    <div class="me" id="me"></div>
    <button class="theme" id="theme" type="button" title="Switch light / dark" aria-label="Switch light or dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg>
    </button>
  </header>

  <main>
    <section class="drop" id="dropzone" tabindex="0" role="button" aria-label="Upload files">
      <div class="drop-lines" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="drop-text">
        <strong>Drop files, folders or Logic projects</strong>
        <span><u>Choose files</u> / <u id="pick-folder">choose a folder</u>. Everyone on Courier can download them.</span>
      </div>
      <input id="picker" type="file" multiple hidden>
      <input id="folder-picker" type="file" webkitdirectory hidden>
    </section>

    <div class="list-head">
      <h2>Shared</h2>
      <span id="count"></span>
    </div>
    <ul class="files" id="files"></ul>
    <p class="empty" id="empty" hidden>Nothing shared yet.</p>
  </main>

  <aside class="uploads" id="uploads" hidden>
    <h3>Uploading</h3>
    <ul id="upload-list"></ul>
  </aside>

  <div class="drag-frame" id="drag-overlay" hidden><span>Drop to upload</span></div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
